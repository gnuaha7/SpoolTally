[build-system]
requires = ["setuptools==84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "spooltally"
version = "0.1.0"
description = "Local-first 3D printer filament inventory manager"
requires-python = ">=3.13"
dependencies = [
    "fastapi==0.162.0",
    "pydantic==2.14.2",
    "SQLAlchemy==2.1.8",
    "alembic==1.20.1",
    "httpx==0.28.1",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.2.0",
    "ruff==0.17.3",
    "mypy==2.4.1",
]

[tool.setuptools.packages.find]
where = ["src"]
namespaces = true

[tool.setuptools.data-files]
"share/spooltally" = ["alembic.ini"]
"share/spooltally/alembic" = ["alembic/env.py"]
"share/spooltally/alembic/versions" = ["alembic/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.13"
files = ["src"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
